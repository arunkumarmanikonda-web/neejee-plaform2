name: Verify Neejee database migrations
on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'prisma/**'
      - '.github/fixtures/legacy-database-functions.sql'
      - '.github/workflows/supabase-verify.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Verify migrations on isolated local Supabase
    runs-on: ubuntu-latest
    env:
      BASE_SCHEMA_COMMIT: dc61939838174f77ca7ecb18a14d6287175771b7
      LOCAL_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Rebuild the existing application schema for the empty CI database
        shell: bash
        run: |
          set -euo pipefail
          git show "$BASE_SCHEMA_COMMIT:prisma/schema.prisma" > "$RUNNER_TEMP/base.prisma"
          baseline=supabase/migrations/20000101000000_ci_application_baseline.sql
          npx --yes prisma@5.22.0 migrate diff --from-empty --to-schema-datamodel "$RUNNER_TEMP/base.prisma" --script > "$baseline"
          cat .github/fixtures/legacy-database-functions.sql >> "$baseline"
      - name: Replay the Supabase migration history
        run: |
          supabase db start
          supabase db reset --local
      - name: Apply later Prisma migrations on the same disposable schema
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' migration; do
            psql "$LOCAL_DB_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done < <(git diff --name-only --diff-filter=AM -z "$BASE_SCHEMA_COMMIT" HEAD -- 'prisma/migrations/*/migration.sql')
          psql "$LOCAL_DB_URL" -v ON_ERROR_STOP=1 -c 'SELECT "codAttemptKey", "checkoutTaxSnapshot", "shiprocketPaymentMode" FROM public."Order" LIMIT 0' -c 'SELECT "priceBasis" FROM public."SalesInvoice" LIMIT 0'
